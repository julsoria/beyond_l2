[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond_l2"
version = "0.1.0"
authors = [
    { name = "Jules Soria", email = "jules.soria@cea.fr" },
    { name = "Alban Grastien" },
    { name = "Romain Xu-Darme" },
    { name = "Julien Girard-Satabin" },
    { name = "Zakaria Chihani" },
    { name = "Daniela Cancila" },
]
description = "Code for 'Beyond L2: Generalizing Abductive Latent Explanations to Diverse Prototype-Based Architectures' (ECML PKDD 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "LGPL-2.1-or-later" }
dependencies = [
    "cabrnet==1.2",
    "torch>=2.0.0",
    "torchvision>=0.13.0",
    "numpy>=1.19.5",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.3",
]

[tool.setuptools.packages.find]
include = ["beyond_l2_ext*"]
