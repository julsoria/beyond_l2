param_groups:
  backbone:
    include: extractor.convnet
  addons:
    include: extractor.add_on
  prototypes:
  - classifier.prototypes
  - classifier.proto_slot_map
  last_layer: classifier.last_layer
optimizers:
  warmup_optimizer:
    type: AdamW
    groups:
      addons:
        lr: 0.00025
        betas:
        - 0.9
        - 0.995
        weight_decay: 0.001
      prototypes:
        lr: 0.00075
  joint_optimizer:
    type: AdamW
    groups:
      backbone:
        lr: 2.5e-05
        betas:
        - 0.9
        - 0.995
        weight_decay: 0.001
      addons:
        lr: 0.00025
        betas:
        - 0.9
        - 0.995
        weight_decay: 0.001
      prototypes:
        lr: 0.00075
    scheduler:
      type: StepLR
      params:
        step_size: 20
        gamma: 0.5
  last_layer_optimizer:
    type: AdamW
    groups:
      last_layer:
        lr: 2.5e-05
        weight_decay: 0.01
    scheduler:
      type: StepLR
      params:
        step_size: 5
        gamma: 0.2
num_epochs: 25
periods:
  warmup:
    epoch_range:
    - 0
    - 4
    freeze:
    - backbone
    - last_layer
    optimizers:
    - warmup_optimizer
  main_training:
    epoch_range:
    - 5
    - 25
    freeze: last_layer
    optimizers:
    - joint_optimizer
    patience: 12
auxiliary_info:
  loss_coefficients:
    clustering: 0.8
    separability: -0.08
    regularization: 0.0001
  training_config:
    gumbel_min_scale: 1.3
    gumbel_max_scale: 1000
    gumbel_epochs: 30
    use_mix_up: true
epilogue:
  num_fine_tuning_epochs: 15
