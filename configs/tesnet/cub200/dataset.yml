train_set:
  module: torchvision.datasets
  name: ImageFolder
  partition:
  - 0.0
  - 0.8
  partition_seed: 42
  params:
    root: data/CUB_200_2011/dataset/train_crop
    transform:
      gaussian_blur:
        type: GaussianBlur
        params:
          kernel_size: [3, 3] # A light blur
          sigma: [0.1, 1.0]
      # random_affine:
      #   type: RandomAffine
      #   params:
      #     degrees: 10
      #     shear: 10
      # random_perspective:
      #   type: RandomPerspective
      #   params:
      #     distortion_scale: 0.2
      #     p: 0.5
      random_horizontal_flip:
        type: RandomHorizontalFlip
        params:
          p: 0.5
      color_jitter: # Bring this back, but make it safe for fine-grained classification
        type: ColorJitter
        params:
          brightness: 0.4 # Pushes lighting variations
          contrast: 0.4   # Pushes shadow/highlight variations
          saturation: 0.0 # STRICT 0: Preserves biological colors
          hue: 0.0        # STRICT 0: Preserves biological colors
      random_resized_crop:
        type: RandomResizedCrop
        params:
          size: [224, 224]
          scale: [0.90, 1.0] # A very safe 10% variance. Just enough to prevent pixel-perfect memorization.
      # resize:
      #   type: Resize
      #   params:
      #     size: [224, 224]
      to_tensor:
        type: ToTensor
      normalize:
        type: Normalize
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
  batch_size: 32
  shuffle: True
  num_workers: 16
  prefetch_factor: 4       # Forces each worker to queue 4 batches in advance
  persistent_workers: True # Stops the workers from dying between epochs
  pin_memory: True         # Speeds up the CPU-to-GPU transfer

