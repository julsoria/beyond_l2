train_set:
  module: torchvision.datasets
  name: OxfordIIITPet
  partition:
  - 0.0
  - 0.8
  partition_seed: 42
  params:
    root: data
    split: trainval
    download: true
    transform: # PIPNet Transform 1
      resize:
        type: Resize
        params:
          size: [ 232, 232 ]
      augment:
        module: cabrnet.core.utils.custom_preprocess
        type: TrivialAugmentWideShapeOnly
      h_flip:
        type: RandomHorizontalFlip
      crop:
        type: RandomResizedCrop
        params:
          size: 228
          scale: [ 0.95, 1.0 ]
      splitter:
        module: cabrnet.core.utils.custom_preprocess
        type: AugmentationSplitter
        params:
          num_samples: 2
          transform:
            type: Compose # PIPNet Transform 2
            transforms:
              - module: cabrnet.core.utils.custom_preprocess
                type: TrivialAugmentWideNoShape
              - type: RandomCrop
                params:
                  size: [ 224, 224 ]
              - type: ToTensor
              - type: Normalize
                params:
                  mean: [ 0.485, 0.456, 0.406 ]
                  std: [ 0.229, 0.224, 0.225 ]
  batch_size: 16  # Lowered to prevent OOM
  num_workers: 4
  collate_fn: concat_collate
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

pretrain_set:
  module: torchvision.datasets
  name: OxfordIIITPet
  partition:
  - 0.0
  - 0.8
  partition_seed: 42
  params:
    root: data
    split: trainval
    download: true
    transform: # PIPNet Transform 1b (slightly larger initial resize)
      resize:
        type: Resize
        params:
          size: [ 256, 256 ]
      augment:
        module: cabrnet.core.utils.custom_preprocess
        type: TrivialAugmentWideShapeOnly
      h_flip:
        type: RandomHorizontalFlip
      crop:
        type: RandomResizedCrop
        params:
          size: 228
          scale: [ 0.95, 1.0 ]
      splitter:
        module: cabrnet.core.utils.custom_preprocess
        type: AugmentationSplitter
        params:
          num_samples: 2
          transform:
            type: Compose 
            transforms:
              - module: cabrnet.core.utils.custom_preprocess
                type: TrivialAugmentWideNoShape
              - type: RandomCrop
                params:
                  size: [ 224, 224 ]
              - type: ToTensor
              - type: Normalize
                params:
                  mean: [ 0.485, 0.456, 0.406 ]
                  std: [ 0.229, 0.224, 0.225 ]
  batch_size: 32 # Lowered to prevent OOM
  num_workers: 4
  collate_fn: concat_collate
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

